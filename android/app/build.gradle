plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aidocumenthelper.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.aidocumenthelper.app"
        minSdk 24
        targetSdk 36

        def isReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
        if (isReleaseTask && (!System.getenv("VERSION_CODE") || !System.getenv("VERSION_NAME"))) {
            throw new GradleException("ERROR: VERSION_CODE and VERSION_NAME environment variables are mandatory for release builds.")
        }

        def vCode = System.getenv("VERSION_CODE") ? Integer.parseInt(System.getenv("VERSION_CODE")) : 8
        def vName = System.getenv("VERSION_NAME") ?: "1.0.1"
        versionCode vCode
        versionName vName

        def prodUrl = System.getenv("PRODUCTION_API_BASE_URL") ?: System.getenv("VITE_API_BASE_URL") ?: ""
        resValue "string", "production_web_url", prodUrl

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            def uploadKeystore = file("upload-keystore.jks")
            if (uploadKeystore.exists()) {
                def password = System.getenv("NEW_UPLOAD_KEY_PASSWORD") ?: ""
                if (password.isEmpty() && gradle.startParameter.taskNames.any { it.contains("Release") }) {
                    throw new GradleException("ERROR: NEW_UPLOAD_KEY_PASSWORD is required to sign release AAB.")
                }
                storeFile uploadKeystore
                storePassword password
                keyAlias "upload"
                keyPassword password
            } else if (gradle.startParameter.taskNames.any { it.contains("Release") }) {
                throw new GradleException("ERROR: Production release signing requires upload-keystore.jks. The old compromised release.keystore is forbidden.")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // Official Google Play Billing Client 8.x
    implementation 'com.android.billingclient:billing-ktx:8.0.0'
    
    // Android Credential Manager & Google Play Identity (Google Sign-In Account Picker)
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
}

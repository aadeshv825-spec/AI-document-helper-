name: Build Android Release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Replace Android web assets with a clean build from source
        run: |
          ASSETS_DIR=android/app/src/main/assets/public

          # Remove every previously committed/generated asset so no stale
          # bundles or archives can ship in the release.
          rm -rf "$ASSETS_DIR"
          mkdir -p "$ASSETS_DIR"

          cp -r dist/assets "$ASSETS_DIR/assets"
          cp dist/index.html "$ASSETS_DIR/index.html"
          cp dist/manifest.json "$ASSETS_DIR/manifest.json"
          cp dist/icon.svg "$ASSETS_DIR/icon.svg"
          cp dist/sw.js "$ASSETS_DIR/sw.js"

          # Bundled backend rebuilt from the current server.ts.
          cp dist/server.cjs "$ASSETS_DIR/server.cjs"
          cp dist/server.cjs.map "$ASSETS_DIR/server.cjs.map"

          # Fail if any archive or signing material ended up in assets.
          if find "$ASSETS_DIR" -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pem' \) | grep -q .; then
            echo "ERROR: Archive or signing material found in Android assets."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set Android SDK path
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: ANDROID_HOME is not configured on this runner."
            exit 1
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Restore upload keystore
        env:
          NEW_UPLOAD_KEYSTORE_BASE64: ${{ secrets.NEW_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NEW_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "ERROR: NEW_UPLOAD_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          printf '%s' "$NEW_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks

      - name: Verify upload keystore
        env:
          NEW_UPLOAD_KEY_PASSWORD: ${{ secrets.NEW_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$NEW_UPLOAD_KEY_PASSWORD" ]; then
            echo "ERROR: NEW_UPLOAD_KEY_PASSWORD secret is missing."
            exit 1
          fi
          keytool -list \
            -v \
            -keystore android/app/upload-keystore.jks \
            -storetype PKCS12 \
            -storepass "$NEW_UPLOAD_KEY_PASSWORD" \
            -alias upload

      - name: Build Release AAB
        env:
          NEW_UPLOAD_KEY_PASSWORD: ${{ secrets.NEW_UPLOAD_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease --no-daemon

      - name: Remove restored keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ai-document-helper-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab


name: Build Android Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Update bundled backend
        run: |
          cp dist/server.cjs android/app/src/main/assets/public/server.cjs
          cp dist/server.cjs.map android/app/src/main/assets/public/server.cjs.map

      - name: Copy complete web build into Android assets
        run: |
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/assets
          cp -r dist/assets android/app/src/main/assets/public/assets
          cp dist/index.html android/app/src/main/assets/public/index.html
          cp dist/manifest.json android/app/src/main/assets/public/manifest.json
          cp dist/icon.svg android/app/src/main/assets/public/icon.svg
          cp dist/sw.js android/app/src/main/assets/public/sw.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore upload keystore
        env:
          NEW_UPLOAD_KEYSTORE_BASE64: ${{ secrets.NEW_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$NEW_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks

      - name: Verify upload keystore
        env:
          NEW_UPLOAD_KEY_PASSWORD: ${{ secrets.NEW_UPLOAD_KEY_PASSWORD }}
        run: |
          keytool -list \
            -v \
            -keystore android/app/upload-keystore.jks \
            -storetype PKCS12 \
            -storepass "$NEW_UPLOAD_KEY_PASSWORD" \
            -alias upload

      - name: Build Release AAB
        env:
          NEW_UPLOAD_KEY_PASSWORD: ${{ secrets.NEW_UPLOAD_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease --no-daemon

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ai-document-helper-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

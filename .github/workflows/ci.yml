name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apptest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Generate and verify Android assets
        run: npm run android:assets

      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/upload-artifact@v4
        with:
          name: android-web-assets
          path: android/app/src/main/assets/public
          retention-days: 3

  android:
    runs-on: ubuntu-latest
    needs: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: android-web-assets
          path: android/app/src/main/assets/public

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android debug build (unsigned, no secrets)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

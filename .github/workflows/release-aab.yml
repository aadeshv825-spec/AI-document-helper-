name: Build Android Release AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (must be higher than every version already uploaded to Google Play)'
        required: true
      version_name:
        description: 'versionName shown to users (e.g. 1.0.1)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Production backend, set in Settings > Secrets and variables >
      # Actions > Variables. The build fails if it is missing.
      VITE_API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
      REQUIRE_API_BASE_URL: 'true'
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release inputs
        run: |
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -le 7 ]; then
            echo "ERROR: version_code must be a whole number greater than 7 (the highest versionCode in this repository's history)."
            exit 1
          fi
          if ! [[ "$VERSION_NAME" =~ ^[0-9A-Za-z.+-]{1,32}$ ]]; then
            echo "ERROR: version_name is invalid."
            exit 1
          fi
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "ERROR: Repository variable PRODUCTION_API_BASE_URL is not set."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install web dependencies (lockfile)
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Generate Android web assets from this build
        run: npm run android:assets

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set Android SDK path
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            echo "ERROR: ANDROID_HOME is not configured on this runner."
            exit 1
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Restore upload keystore
        env:
          NEW_UPLOAD_KEYSTORE_BASE64: ${{ secrets.NEW_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NEW_UPLOAD_KEYSTORE_BASE64" ]; then
            echo "ERROR: NEW_UPLOAD_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          printf '%s' "$NEW_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks

      - name: Build Release AAB
        env:
          NEW_UPLOAD_KEY_PASSWORD: ${{ secrets.NEW_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$NEW_UPLOAD_KEY_PASSWORD" ]; then
            echo "ERROR: NEW_UPLOAD_KEY_PASSWORD secret is missing."
            exit 1
          fi
          cd android
          chmod +x gradlew
          ./gradlew clean bundleRelease --no-daemon

      - name: Upload certificate fingerprint of the keystore
        env:
          NEW_UPLOAD_KEY_PASSWORD: ${{ secrets.NEW_UPLOAD_KEY_PASSWORD }}
        run: |
          # Certificate fingerprints are public information.
          keytool -list -v -keystore android/app/upload-keystore.jks -storetype PKCS12 \
            -storepass "$NEW_UPLOAD_KEY_PASSWORD" -alias upload \
            | grep -E "SHA256:" | head -1 | sed 's/^.*SHA256: *//' > keystore-sha256.txt
          echo "Keystore upload certificate SHA-256: $(cat keystore-sha256.txt)"

      - name: Remove restored keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks

      - name: Verify AAB (package, version, signature, contents)
        env:
          EXPECTED_UPLOAD_CERT_SHA256: ${{ vars.EXPECTED_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"

          curl -sSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar

          PKG=$(java -jar bundletool.jar dump manifest --bundle "$AAB" --xpath /manifest/@package)
          VC=$(java -jar bundletool.jar dump manifest --bundle "$AAB" --xpath /manifest/@android:versionCode)
          DEBUGGABLE=$(java -jar bundletool.jar dump manifest --bundle "$AAB" --xpath /manifest/application/@android:debuggable || true)
          echo "package=$PKG versionCode=$VC debuggable=${DEBUGGABLE:-not set}"

          [ "$PKG" = "com.aidocumenthelper.app" ] || { echo "ERROR: wrong package"; exit 1; }
          [ "$VC" = "$VERSION_CODE" ] || { echo "ERROR: wrong versionCode"; exit 1; }
          [ -z "$DEBUGGABLE" ] || [ "$DEBUGGABLE" = "false" ] || { echo "ERROR: debuggable release"; exit 1; }

          jarsigner -verify "$AAB" > /dev/null || { echo "ERROR: AAB signature does not verify"; exit 1; }
          AAB_SHA256=$(keytool -printcert -jarfile "$AAB" | grep -E "SHA256:" | head -1 | sed 's/^.*SHA256: *//')
          echo "AAB signing certificate SHA-256: $AAB_SHA256"
          [ "$AAB_SHA256" = "$(cat keystore-sha256.txt)" ] || { echo "ERROR: AAB not signed with the upload keystore"; exit 1; }

          if [ -n "${EXPECTED_UPLOAD_CERT_SHA256:-}" ]; then
            [ "$AAB_SHA256" = "$EXPECTED_UPLOAD_CERT_SHA256" ] || { echo "ERROR: AAB certificate does not match the Play-approved upload certificate"; exit 1; }
            echo "AAB certificate matches EXPECTED_UPLOAD_CERT_SHA256."
          else
            echo "WARNING: EXPECTED_UPLOAD_CERT_SHA256 is not set; cannot confirm this is the Play-approved upload certificate."
          fi

          mkdir -p aab-check && cd aab-check && unzip -q "../$AAB"
          if find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pem' -o -name 'server.cjs*' -o -name '*.map' \) | grep -q .; then
            echo "ERROR: forbidden file inside AAB"; exit 1
          fi
          if grep -rIl -E "ais-dev-[a-z0-9-]+\.run\.app|BEGIN [A-Z ]*PRIVATE KEY" base/assets 2>/dev/null | grep -q .; then
            echo "ERROR: development URL or private key inside AAB assets"; exit 1
          fi
          echo "AAB content checks passed."

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ai-document-helper-release-aab-${{ inputs.version_code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
